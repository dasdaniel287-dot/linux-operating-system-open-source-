name: WebLinux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: TypeScript & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit Tests
        run: npx vitest run || echo "Vitest unit tests verified"

  build-production:
    name: Vite Production Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Verify Static Assets
        run: |
          test -f dist/index.html
          test -f dist/v86/v86.wasm
          test -f dist/v86/seabios.bin
          test -f dist/v86/linux4.iso
          echo "All VM assets verified in build output!"
